# The type check reads the engine type file out of the installed Claude Code CLI (the file is not in the public repo).
# The full suite has passed on Windows and macOS, so a failure on either fails the run.
name: ci
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]
# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Decides whether the change is documents only (scripts/ci-docs-only.sh). A documents-only change runs just the quick text checks here and skips the `check` job.
  # A skipped job reports success, so no required check stays pending. An unknown base (first push, forced push) counts as code.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.decide.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Is this change documents only
        id: decide
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          docs_only=false
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sh scripts/ci-docs-only.sh; then docs_only=true; fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "documents only: $docs_only"
      - uses: actions/setup-node@v7
        if: steps.decide.outputs.docs_only == 'true'
        with:
          node-version: 22
      - name: Quick text checks
        if: steps.decide.outputs.docs_only == 'true'
        run: |
          scripts/check-public.sh
          scripts/check-strings.sh --strict
          sh scripts/check-names.sh
          sh scripts/check-comments.sh

  check:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # Git Bash on the Windows runner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Line endings: the index must hold LF only (.gitattributes keeps it so). Binary files never match.
      - name: No CRLF in the index
        run: |
          BAD=$(git ls-files --eol | awk '$1 == "i/crlf" || $1 == "i/mixed" {print $NF}')
          if [ -n "$BAD" ]; then echo "CRLF or mixed line endings in the index:"; echo "$BAD"; exit 1; fi
          echo "line endings: clean"

      # The documented install: the npm package of the CLI (its postinstall fetches the native program).
      # Whether `claude plugin ...` needs a login or an API key on a CI machine is not verified here.
      # If it does, it needs a repository secret; this file never holds one.
      - name: Install the Claude Code CLI and TypeScript
        run: |
          npm install -g @anthropic-ai/claude-code typescript
          claude --version
          tsc --version

      - name: Public check
        run: scripts/check-public.sh
      - name: Token check
        run: scripts/check-tokens.sh
      - name: Command check
        run: scripts/check-commands.sh
      - name: Model gate check
        run: |
          scripts/check-model-gate.sh --selftest
          scripts/check-model-gate.sh
      # The one text table (`mods/cockpit/hooks/i18n`): every row has every language; a name used in code is in the table. Visible texts not yet in it are only listed.
      - name: Strings check
        run: |
          scripts/check-strings.sh --selftest
          scripts/check-strings.sh --strict
      - name: Names check
        run: sh scripts/check-names.sh
      # Reads the code with the TypeScript JS API (the installed tsc may be the native one, which has none), so a known 5.x is fetched into the runner's temp folder.
      - name: Plain capability check
        run: |
          npm install --prefix "$RUNNER_TEMP/ts" typescript@5.9.3
          TYPESCRIPT_JS="$RUNNER_TEMP/ts/node_modules/typescript/lib/typescript.js" node scripts/check-plain-capability.mjs --selftest
          TYPESCRIPT_JS="$RUNNER_TEMP/ts/node_modules/typescript/lib/typescript.js" node scripts/check-plain-capability.mjs
      # The plugin directory's pre-submission rules: a blocking finding fails the run; policy holds are printed and allowed.
      - name: Directory check
        run: |
          export TYPESCRIPT_JS="$RUNNER_TEMP/ts/node_modules/typescript/lib/typescript.js"
          bash scripts/check-directory.sh --selftest
          bash scripts/check-directory.sh
      - name: Comment check
        run: |
          sh scripts/check-comments.sh --selftest
          sh scripts/check-comments.sh
      # The engine type file is not in the public repo: typecheck.sh reads it out of the Claude Code CLI installed above.
      # If it cannot (CI=true and no file), it prints "typecheck: skipped: no host type file" and the run goes on.
      - name: Type check
        run: |
          export TSC="$(command -v tsc)"
          scripts/typecheck.sh
      # The plugin check may need bun or Node on Windows.
      - name: Plugin validate
        run: claude plugin validate mods/cockpit
      - name: Plugin test
        run: sh scripts/test-cockpit.sh
